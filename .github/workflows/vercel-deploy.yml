name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Trigger Vercel deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Normalize generated resources and discovery files
        run: |
          node scripts/repair-generated-resources.mjs
          node scripts/migrate-privacy-controls.mjs
          node scripts/generate-resource-feed.mjs

      - name: Commit generated resource fixes
        run: |
          if git diff --quiet -- 'resources/**/*.html' 'data/remote-image-dimensions.json' 'feed.xml'; then
            echo "Generated resources and discovery files are current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'resources/**/*.html' 'data/remote-image-dimensions.json' 'feed.xml'
          git commit -m "Normalize generated SEO resources [skip ci]"
          git push origin HEAD:main

      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret is not configured."
            exit 1
          fi

          curl --fail --show-error --silent --request POST "$VERCEL_DEPLOY_HOOK_URL"
