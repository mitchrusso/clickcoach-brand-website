<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Make coaching progress visible">
  <rect width="1080" height="1080" fill="#FFFFFF"/>
  <rect x="70" y="70" width="940" height="940" rx="52" fill="#F7FAFF"/>
  <text x="100" y="175" font-family="Montserrat, Arial, sans-serif" font-size="78" font-weight="900" fill="#0C0C0D">Make progress</text>
  <text x="100" y="265" font-family="Montserrat, Arial, sans-serif" font-size="78" font-weight="900" fill="#2463EB">easier to prove.</text>
  <g transform="translate(120 380)">
    <rect width="840" height="360" rx="32" fill="#FFFFFF" stroke="#D7E2F7" stroke-width="3"/>
    <line x1="90" y1="280" x2="760" y2="280" stroke="#CBD5E1" stroke-width="5"/>
    <rect x="135" y="165" width="80" height="115" rx="12" fill="#C5FAE8"/>
    <rect x="275" y="120" width="80" height="160" rx="12" fill="#EAF2FF"/>
