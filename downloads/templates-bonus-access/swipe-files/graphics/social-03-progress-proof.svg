  </g>
  <text x="100" y="860" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#51627A">Notes + follow-up + outcomes in one place.</text>
  <text x="100" y="930" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#2463EB">Shared by [PARTNER NAME]</text>
</svg>
